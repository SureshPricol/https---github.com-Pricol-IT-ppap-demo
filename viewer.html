<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewer - PPAP Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .form-header {
            /* margin-bottom: 1rem; */
            border-bottom: 1px solid #e2e8f0;
            /* padding-bottom: 0.5rem; */
        }

        .document-info {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1rem;
        }

        .info-item {
            color: #64748b;
            font-size: 0.875rem;
        }

        .email-container {
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .email-input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .btn-remove {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-remove:hover {
            background: #dc2626;
        }

        .btn-add-email {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn-add-email:hover {
            background: #0969a0;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <img src="1.png" width="150" alt="Pricol">
            </div>
            <nav class="nav-menu">
                <ul>
                    <li>
                        <a href="index.html"><i class="fas fa-home"></i>Dashboard</a>
                    </li>
                    <li class="active">
                        <a href="ppap.html"><i class="fas fa-user"></i>PPAP</a>
                    </li>
                    <li>
                        <a href="sop.html"><i class="fas fa-users"></i>SOP</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <button class="menu-toggle">☰</button>
                <h1 class="page-title">PPAP - Add viewers</h1>
                <div class="user-profile">
                    <div class="profile-info">
                        <span class="user-name">Suresh</span>
                        <span class="user-role">User</span>
                    </div>
                    <div class="profile-image">JD</div>
                </div>
            </header>

            <!-- Breadcrumb Navigation -->
            <div class="breadcrumb">
                <a href="#">Home</a>
                <span class="separator">></span>
                <a href="ppap.html">PPAP</a>
                <span class="separator">></span>
                <span>Viewer</span>
            </div>

            <div class="ppap-content">
                <div class="form-container">
                    <div class="form-header">
                        <h2>PPAP - Add Viewers</h2>

                    </div>
                    <form id="viewerForm" class="form-content">
                        <div class="form-group full-width">
                            <label>Viewers List</label>
                            <div id="emailInputsContainer">
                                <div class="email-container">
                                    <input type="email" class="email-input" placeholder="Enter email address">
                                </div>
                            </div>
                            <button type="button" id="addEmailBtn" class="btn-add-email">
                                <i class="fas fa-plus"></i> Add Viewer
                            </button>
                        </div>

                        <div class="form-actions">
                            <a href="ppap.html" class="btn-back">Cancel</a>
                            <button type="submit" class="btn-submit">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const menuToggle = document.querySelector('.menu-toggle');
            const sidebar = document.querySelector('.sidebar');
            const mainContent = document.querySelector('.main-content');

            // Handle menu toggle
            menuToggle.addEventListener('click', function () {
                sidebar.classList.toggle('collapsed');
                sidebar.classList.toggle('sidebar-hidden');
                mainContent.classList.toggle('expanded');
                document.body.classList.toggle('sidebar-hidden');
            });

            // Handle form submission
            const viewerForm = document.getElementById('viewerForm');
            viewerForm.addEventListener('submit', function (e) {
                e.preventDefault();

                // Get all email inputs
                const emailInputs = document.querySelectorAll('.email-input');
                const viewers = Array.from(emailInputs).map(input => input.value);

                // Here you can add code to handle the viewers data
                console.log('Viewers:', viewers);

                // Redirect to ppap page
                window.location.href = 'ppap.html';
            });

            // Handle adding new email inputs
            const addEmailBtn = document.getElementById('addEmailBtn');
            const emailInputsContainer = document.getElementById('emailInputsContainer');

            addEmailBtn.addEventListener('click', function () {
                const newEmailContainer = document.createElement('div');
                newEmailContainer.className = 'email-container';

                const newEmailInput = document.createElement('input');
                newEmailInput.type = 'email';
                newEmailInput.className = 'email-input';
                newEmailInput.placeholder = 'Enter email address';

                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'btn-remove';
                removeBtn.textContent = 'Remove';
                removeBtn.onclick = function () {
                    newEmailContainer.remove();
                };

                newEmailContainer.appendChild(newEmailInput);
                newEmailContainer.appendChild(removeBtn);
                emailInputsContainer.appendChild(newEmailContainer);
            });
        });
    </script>
</body>

</html>


</body>

</html>
