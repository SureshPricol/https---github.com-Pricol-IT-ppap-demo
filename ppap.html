<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPAP Management - PPAP Portal</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <img src="1.png" width="150" alt="Pricol">
            </div>
            <nav class="nav-menu">
                <ul>
                    <li>
                        <a href="index.html"><i class="fas fa-home"></i>Dashboard</a>
                    </li>
                    <li class="active">
                        <a href="ppap.html"><i class="fas fa-user"></i>PPAP</a>
                    </li>
                    <li>
                        <a href="sop.html"><i class="fas fa-users"></i>SOP</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="topbar">
                <button class="menu-toggle">☰</button>
                <h1 class="page-title">PPAP Management</h1>
                <div class="user-profile">
                    <div class="profile-info">
                        <span class="user-name">Suresh</span>
                        <span class="user-role">User</span>
                    </div>
                    <div class="profile-image">JD</div>
                </div>
            </header>

            <!-- Breadcrumb -->
            <div class="breadcrumb">
                <a href="#">Home</a>
                <span class="separator">></span>
                <span>PPAP</span>
            </div>

            <!-- PPAP Content -->
            <div class="ppap-content">
                <div class="section-header">
                    <h2>PPAP Management</h2>
                    <a href="create.html" class="btn-add" id="addNewPPAP">Add New</a>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Description</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Sample PPAP 1</td>
                                <td>Initial PPAP submission for Product A</td>
                                <td>Draft</td>
                                <td>
                                    <button class="btn-view"
                                        onclick="window.location.href='ppapview.html'">View</button>
                                    <button class="btn-history"
                                        onclick="window.location.href='history.html'">History</button>
                                    <button class="btn-command"
                                        onclick="window.location.href='ppapcommand.html'">Comment</button>
                                </td>
                            </tr>
                            <tr>
                                <td>Sample PPAP 2</td>
                                <td>Follow-up PPAP for Product B</td>
                                <td>In Review</td>
                                <td>
                                    <button class="btn-view"
                                        onclick="window.location.href='ppapview.html'">View</button>
                                    <button class="btn-history"
                                        onclick="window.location.href='history.html'">History</button>
                                    <button class="btn-command"
                                        onclick="window.location.href='ppapcommand.html'">Comment</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
